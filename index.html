<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CYBER QUEST XI — Network Security Mission</title>
<meta name="description" content="Game pembelajaran interaktif Keamanan Jaringan kelas XI TKJ (Fase F)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
<!-- Tailwind CSS (CDN) -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Font Awesome (CDN) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<!-- Chart.js (CDN) untuk grafik dashboard guru -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* =========================================================
   CYBER QUEST XI — DESIGN TOKENS
   ========================================================= */
:root{
  --night:#070b1c; --panel:rgba(14,26,56,.82); --panel-solid:#0e1a38; --panel-2:rgba(20,36,76,.9);
  --line:rgba(125,211,252,.16); --line-2:rgba(56,189,248,.38);
  --cyan:#22d3ee; --blue:#3b82f6; --violet:#a78bfa; --green:#34d399; --amber:#fbbf24; --rose:#fb7185;
  --text:#e7eefb; --muted:#93a4c3;
  --fs-q:1.22rem;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --font-display:'Orbitron','Plus Jakarta Sans',system-ui,sans-serif;
  --font-body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Consolas,'Courier New',monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:80px}
body{
  margin:0;min-height:100vh;color:var(--text);font-family:var(--font-body);line-height:1.55;
  background:
    radial-gradient(1100px 600px at 8% -10%, rgba(59,130,246,.20), transparent 60%),
    radial-gradient(900px 520px at 105% 5%, rgba(167,139,250,.16), transparent 60%),
    radial-gradient(900px 600px at 50% 115%, rgba(52,211,153,.10), transparent 60%),
    var(--night);
  background-attachment:fixed;
  padding-bottom:env(safe-area-inset-bottom);
}
#bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.55}
.grid-overlay{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(34,211,238,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,238,.045) 1px,transparent 1px);
  background-size:44px 44px;-webkit-mask-image:radial-gradient(circle at 50% 25%,#000 25%,transparent 75%);mask-image:radial-gradient(circle at 50% 25%,#000 25%,transparent 75%)}
a{color:var(--cyan)}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px;border-radius:8px}

/* ---------- Top bar ---------- */
#topbar{position:sticky;top:0;z-index:40;background:rgba(7,11,28,.78);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.tb-inner{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;background:none;border:0;color:var(--text);cursor:pointer;padding:4px;font-size:1.05rem}
.brand .bt{font-family:var(--font-display);font-weight:800;letter-spacing:.06em}
.brand .bt b{color:var(--cyan)}
#tb-player{margin-left:auto;display:flex;align-items:center;gap:8px}
.tb-actions{display:flex;gap:6px}
.pchip{display:flex;align-items:center;gap:10px;padding:5px 12px 5px 6px;border-radius:999px;border:1px solid var(--line-2);background:rgba(14,26,56,.8);cursor:pointer}
.pav{font-size:1.5rem;width:38px;height:38px;display:grid;place-items:center;border-radius:50%;background:rgba(34,211,238,.1)}
.pname{font-weight:800;font-size:.9rem;line-height:1.1;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plv{font-size:.72rem;color:var(--muted);white-space:nowrap}
.pinfo .xpbar{height:4px;margin-top:3px;width:120px}

#app{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:22px 16px 70px}

/* ---------- Type ---------- */
.font-display{font-family:var(--font-display);letter-spacing:.04em}
.mono{font-family:var(--font-mono)}
.page-title{font-family:var(--font-display);font-weight:800;font-size:clamp(1.5rem,3.6vw,2.1rem);letter-spacing:.03em;margin:0 0 4px}
.section-title{font-family:var(--font-display);font-weight:800;font-size:1.02rem;letter-spacing:.06em;color:var(--cyan);margin:28px 0 12px}
.card .section-title{margin-top:0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.center{text-align:center}
.err{color:var(--rose);font-weight:700;min-height:1.2em;margin-top:8px}

/* ---------- Layout helpers ---------- */
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.row.center{justify-content:center}
.gap-1{gap:6px}
.stack>*+*{margin-top:12px}
.mt{margin-top:16px}.mb{margin-bottom:16px}.mt-s{margin-top:8px}
.grid-auto{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.grid-auto-s{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.grid-2{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:860px){.grid-2{grid-template-columns:1fr 1fr}}

/* ---------- Surfaces ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 12px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.04)}
.card.glow{border-color:rgba(34,211,238,.32);box-shadow:0 0 0 1px rgba(34,211,238,.10),0 0 44px rgba(34,211,238,.10),0 12px 40px rgba(0,0,0,.4)}
.card-link{cursor:pointer;transition:transform .18s,border-color .18s,box-shadow .18s;text-align:left;color:inherit;font:inherit;width:100%}
.card-link:hover{transform:translateY(-3px);border-color:var(--line-2);box-shadow:0 0 30px rgba(34,211,238,.16)}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:48px;padding:.7rem 1.15rem;border-radius:var(--r-md);font-weight:700;font-size:1rem;border:1px solid var(--line-2);background:rgba(15,28,60,.85);color:var(--text);cursor:pointer;transition:transform .12s,filter .15s,background .15s;user-select:none;text-decoration:none;line-height:1.2;font-family:inherit}
.btn:hover{filter:brightness(1.18)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.42;cursor:not-allowed;filter:none;transform:none}
.btn-primary{background:linear-gradient(135deg,#06b6d4,#3b82f6 60%,#8b5cf6);border-color:transparent;color:#fff;box-shadow:0 6px 24px rgba(59,130,246,.35)}
.btn-green{background:linear-gradient(135deg,#059669,#34d399);border-color:transparent;color:#03140d}
.btn-danger{background:rgba(251,113,133,.14);border-color:rgba(251,113,133,.55);color:#fecdd3}
.btn-sm{min-height:40px;padding:.45rem .8rem;font-size:.88rem;border-radius:11px}
.btn-lg{min-height:60px;padding:1rem 1.9rem;font-size:1.15rem;border-radius:18px}
.btn-icon{min-width:42px;padding:.45rem .65rem}
.chip{display:inline-flex;align-items:center;gap:.35rem;padding:.24rem .7rem;border-radius:999px;font-size:.8rem;font-weight:700;border:1px solid var(--line);background:rgba(255,255,255,.04);white-space:nowrap}
.chip.c{border-color:rgba(34,211,238,.4);color:#a5f3fc}
.chip.v{border-color:rgba(167,139,250,.45);color:#ddd6fe}
.chip.g{border-color:rgba(52,211,153,.45);color:#a7f3d0}
.chip.a{border-color:rgba(251,191,36,.45);color:#fde68a}
.chip.r{border-color:rgba(251,113,133,.5);color:#fecdd3}

/* ---------- XP bar ---------- */
.xpbar{height:10px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
.xpbar>span{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--cyan),var(--violet));border-radius:inherit;transition:width .7s ease}

/* ---------- Hero ---------- */
.hero{display:grid;gap:18px;grid-template-columns:1fr;align-items:center;padding:28px}
@media(min-width:900px){.hero{grid-template-columns:1.25fr .75fr;padding:40px 44px}}
.hero-title{font-family:var(--font-display);font-weight:900;font-size:clamp(2.3rem,6.4vw,4.4rem);line-height:1;margin:14px 0 6px;letter-spacing:.02em;
  background:linear-gradient(95deg,#67e8f9 0%,#60a5fa 40%,#c4b5fd 75%,#6ee7b7 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 26px rgba(34,211,238,.28))}
.hero-sub{font-family:var(--font-display);font-weight:600;color:#bfdbfe;letter-spacing:.08em;font-size:clamp(.8rem,2vw,1rem);margin:0}
.hero-term{font-family:var(--font-mono);color:#86efac;margin:18px 0 22px;font-size:clamp(.95rem,2.4vw,1.15rem);min-height:1.6em}
.caret{animation:blink 1s steps(1) infinite;color:var(--cyan)}
.hero-svg{width:100%;max-width:330px;margin:0 auto;display:block}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}

/* ---------- Home ---------- */
.menu-card{display:flex;gap:14px;align-items:flex-start;padding:18px}
.menu-emo{font-size:2rem;width:56px;height:56px;flex:0 0 56px;display:grid;place-items:center;border-radius:16px;background:rgba(34,211,238,.08);border:1px solid var(--line)}
.menu-t{font-weight:800;font-size:1.08rem}
.menu-d{color:var(--muted);font-size:.9rem}
.stat{padding:16px}
.stat .v{font-family:var(--font-display);font-weight:800;font-size:1.6rem}
.stat .k{color:var(--muted);font-size:.85rem}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.flow-step{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(14,26,56,.7);cursor:pointer;color:var(--text);font:inherit;font-weight:700;font-size:.9rem}
.flow-step:hover{border-color:var(--cyan)}
.flow-step .n{font-family:var(--font-display);color:var(--cyan);font-size:.85rem}
.flow-arrow{color:var(--muted)}

/* ---------- Login ---------- */
.avatars{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:10px}
.av-btn{font-size:2rem;height:64px;border-radius:16px;border:2px solid var(--line);background:rgba(14,26,56,.8);cursor:pointer}
.av-btn.sel{border-color:var(--cyan);box-shadow:0 0 18px rgba(34,211,238,.45);background:rgba(34,211,238,.12)}
.inp{width:100%;background:rgba(2,6,23,.6);border:1.5px solid var(--line-2);border-radius:12px;color:var(--text);padding:12px 14px;font-size:1rem;font-family:inherit}
.inp:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,211,238,.2)}
select.inp{cursor:pointer}
select.inp option{background:#0e1a38;color:var(--text)}
.lbl{display:block;font-weight:700;margin-bottom:6px}

/* ---------- Game runner ---------- */
.gamebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:14px}
.runner-title{font-family:var(--font-display);font-weight:800;font-size:1.05rem}
.qcount{font-family:var(--font-display);font-weight:800;color:var(--cyan);letter-spacing:.08em}
.timer{font-family:var(--font-display);font-weight:800;font-size:1.25rem;padding:.35rem .9rem;border-radius:12px;border:1.5px solid var(--line-2);min-width:70px;text-align:center}
.timer.warn{color:var(--amber);border-color:var(--amber)}
.timer.danger{color:var(--rose);border-color:var(--rose);animation:pulse 1s infinite}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.qtext{font-size:var(--fs-q);font-weight:700;line-height:1.5;margin:6px 0 16px}
.qtext.big{font-size:calc(var(--fs-q) * 1.2)}
.scenario{border-left:4px solid var(--cyan);background:rgba(34,211,238,.06);border-radius:0 14px 14px 0;padding:14px 16px;margin-bottom:14px}
.scn-label{font-weight:800;font-size:.82rem;color:var(--cyan);margin-bottom:4px}
.scenario p{margin:0;font-size:1.05rem;line-height:1.6}
.opts{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:760px){.opts.two{grid-template-columns:1fr 1fr}}
.opts.choice3{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;min-height:62px;border-radius:14px;border:1.5px solid var(--line-2);background:rgba(14,26,56,.88);color:var(--text);font-size:1.02rem;font-weight:600;cursor:pointer;transition:border-color .15s,background .15s,transform .15s;font-family:inherit}
.opt:hover:not(:disabled):not(.static){border-color:var(--cyan);background:rgba(34,211,238,.08);transform:translateX(3px)}
.opt .letter{flex:0 0 38px;height:38px;display:grid;place-items:center;border-radius:10px;background:rgba(34,211,238,.12);color:var(--cyan);font-family:var(--font-display);font-weight:800}
.opts.choice3 .opt{flex-direction:column;justify-content:center;text-align:center;min-height:96px;font-size:1.08rem;font-weight:800}
.opts.choice3 .opt:hover:not(:disabled){transform:translateY(-2px)}
.opt.correct{border-color:var(--green);background:rgba(52,211,153,.14)}
.opt.correct .letter{background:var(--green);color:#03140d}
.opt.wrong{border-color:var(--rose);background:rgba(251,113,133,.12)}
.opt.wrong .letter{background:var(--rose);color:#fff}
.opt.dim{opacity:.45}
.opt:disabled{cursor:default}
.opt.static{cursor:default}
.split{display:grid;gap:18px;grid-template-columns:1fr}
@media(min-width:860px){.split{grid-template-columns:.8fr 1.2fr;align-items:start}}

/* feedback */
.feedback{margin-top:16px;border-radius:16px;padding:16px 18px;border:1.5px solid;animation:pop .32s ease}
.feedback.ok{border-color:rgba(52,211,153,.55);background:rgba(52,211,153,.08)}
.feedback.no{border-color:rgba(251,113,133,.5);background:rgba(251,113,133,.07)}
.feedback.part{border-color:rgba(251,191,36,.55);background:rgba(251,191,36,.07)}
.feedback p{margin:.45rem 0}
.fb-head{font-weight:800;font-size:1.25rem;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fb-head.ok{color:#6ee7b7}.fb-head.no{color:#fda4af}.fb-head.part{color:#fde68a}
.xp-pop{font-family:var(--font-display);font-size:.95rem;padding:.2rem .6rem;border-radius:8px;background:rgba(52,211,153,.18);color:#a7f3d0;animation:pop .5s ease}
.tip{margin-top:10px;padding:10px 12px;border-radius:12px;background:rgba(251,191,36,.09);border:1px dashed rgba(251,191,36,.45);color:#fde68a}
.flags{margin-top:10px;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.flags ul{list-style:disc;padding-left:1.2rem;margin:.3rem 0 0}
.battle .fb-head{font-family:var(--font-display);font-size:clamp(1.6rem,5vw,2.6rem);justify-content:center}
.battle .feedback{text-align:center}
.battle .feedback .row{justify-content:center}

/* terminal (forensic) */
.terminal{background:#020617;border:1px solid rgba(52,211,153,.32);border-radius:14px;overflow:hidden;margin-bottom:14px;box-shadow:inset 0 0 30px rgba(52,211,153,.05)}
.term-head{display:flex;align-items:center;gap:6px;padding:8px 12px;background:rgba(52,211,153,.07);border-bottom:1px solid rgba(52,211,153,.2);font-family:var(--font-mono);font-size:.8rem;color:#a7f3d0}
.term-head i{width:10px;height:10px;border-radius:50%;display:inline-block}
.term-body{padding:12px 14px;font-family:var(--font-mono);font-size:.86rem;color:#86efac;overflow-x:auto;white-space:pre;line-height:1.75}

/* chat (social engineering) */
.chat{background:#0b1222;border-radius:16px;border:1px solid var(--line);overflow:hidden;margin-bottom:14px}
.chat-head{display:flex;gap:10px;align-items:center;padding:10px 14px;background:rgba(255,255,255,.04);border-bottom:1px solid var(--line)}
.chat-av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(167,139,250,.18);font-size:1.3rem}
.chat-from{font-weight:800}
.chat-sub{font-size:.78rem;color:var(--muted)}
.bubble{max-width:90%;margin:10px 14px;padding:10px 14px;border-radius:4px 16px 16px 16px;background:#1b2740;white-space:pre-wrap;line-height:1.55;font-size:.97rem;word-break:break-word}

/* network diagram (defend) */
.threat-banner{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;border-radius:14px;border:1.5px solid rgba(251,113,133,.55);background:rgba(251,113,133,.08);margin-bottom:16px;font-size:1.02rem;line-height:1.5}
.threat-banner.done{border-color:rgba(52,211,153,.55);background:rgba(52,211,153,.08)}
.net-diagram{display:flex;flex-direction:column;align-items:center;gap:2px}
.node{display:flex;align-items:center;gap:10px;padding:10px 16px;width:100%;max-width:280px;border-radius:14px;border:1.5px solid var(--line-2);background:rgba(14,26,56,.92);font-weight:700;transition:border-color .3s,box-shadow .3s,background .3s}
.node .nic{font-size:1.35rem}
.node .nstat{margin-left:auto;font-size:.78rem;font-weight:800}
.node.hot{border-color:var(--rose);box-shadow:0 0 18px rgba(251,113,133,.5);background:rgba(251,113,133,.12)}
.node.safe{border-color:var(--green);box-shadow:0 0 22px rgba(52,211,153,.55);background:rgba(52,211,153,.14)}
.node.safe .nstat{color:#6ee7b7}
.node.hit{border-color:var(--rose);background:rgba(251,113,133,.2);animation:shake .45s}
.node.hit .nstat{color:#fda4af}
.link-arrow{color:var(--muted);font-size:.75rem;line-height:1.1}

/* password rank */
.rank-list{display:grid;gap:10px}
.rank-item{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;min-height:58px;border-radius:14px;border:1.5px solid var(--line-2);background:rgba(14,26,56,.88);color:var(--text);cursor:pointer;text-align:left;font:inherit}
.rank-item.picked{border-color:var(--cyan);background:rgba(34,211,238,.08)}
.rank-item.correct{border-color:var(--green)}
.rank-item.wrong{border-color:var(--rose)}
.rank-num{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;background:rgba(255,255,255,.06);color:var(--muted);flex:0 0 36px}
.rank-item.picked .rank-num{background:var(--cyan);color:#03141a}
.pw{font-family:var(--font-mono);font-size:1.05rem;word-break:break-all}
.rank-res{margin-left:auto;font-weight:700;font-size:.85rem}
.pw-exp{padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.03)}
.str{display:inline-block;padding:.15rem .55rem;border-radius:8px;font-size:.78rem;font-weight:800;white-space:nowrap}
.str.weak{background:rgba(251,113,133,.18);color:#fecdd3}
.str.medium{background:rgba(251,191,36,.18);color:#fde68a}
.str.strong{background:rgba(52,211,153,.18);color:#a7f3d0}

/* match */
.match-list{display:grid;gap:10px}
.match-row{display:grid;grid-template-columns:1fr;gap:8px;padding:12px;border-radius:14px;border:1px solid var(--line);background:rgba(14,26,56,.6)}
@media(min-width:700px){.match-row{grid-template-columns:1fr 24px 1.3fr;align-items:center}}
.match-left{font-weight:800}
.match-arrow{color:var(--cyan);text-align:center}
.match-fix{grid-column:1/-1;font-size:.88rem}
.match-row.ok{border-color:var(--green)}
.match-row.bad{border-color:var(--rose)}

/* escape room locks */
.lockrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.lock{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;font-size:1.35rem;border:1.5px solid var(--line-2);background:rgba(14,26,56,.9)}
.lock.open{border-color:var(--green);background:rgba(52,211,153,.15)}
.lock.cur{border-color:var(--amber);box-shadow:0 0 16px rgba(251,191,36,.45)}
.esc-level{text-align:center;font-weight:800;margin-bottom:12px}

/* results */
.big-emoji{font-size:clamp(3rem,10vw,4.6rem);text-align:center;line-height:1}
.big-result{font-family:var(--font-display);font-size:clamp(1.8rem,6.5vw,3.2rem);font-weight:900;text-align:center;margin:8px 0;animation:pop .45s ease;background:linear-gradient(95deg,#67e8f9,#c4b5fd,#6ee7b7);-webkit-background-clip:text;background-clip:text;color:transparent}
.res-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin-top:18px}
.res-box{padding:14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.03);text-align:center}
.res-box .v{font-family:var(--font-display);font-weight:800;font-size:1.45rem}
.res-box .k{color:var(--muted);font-size:.82rem}
details.recap{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:rgba(255,255,255,.02)}
details.recap+details.recap{margin-top:8px}
details.recap summary{cursor:pointer;display:flex;gap:10px;font-weight:600;list-style:none}
details.recap summary::-webkit-details-marker{display:none}
details.recap.no{border-color:rgba(251,113,133,.3)}
.recap-body{padding-top:8px;color:#cbd5e1}
.recap-body p{margin:.35rem 0}

/* badges */
.badge-tile{text-align:center;padding:14px 10px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.03)}
.badge-tile .emo{font-size:2.2rem}
.badge-tile .bn{font-weight:800;font-size:.9rem;margin-top:4px}
.badge-tile .bd{color:var(--muted);font-size:.76rem}
.badge-tile.locked{filter:grayscale(1);opacity:.38}
.badge-tile.got{border-color:rgba(251,191,36,.45);box-shadow:0 0 20px rgba(251,191,36,.12)}

/* report */
.report-box{font-family:var(--font-mono);white-space:pre;overflow-x:auto;color:#a5f3fc;font-size:clamp(.78rem,2.6vw,1rem);line-height:1.5;background:#020617;border:1px solid rgba(34,211,238,.3);border-radius:14px;padding:16px;text-shadow:0 0 8px rgba(34,211,238,.35)}
.pill{display:inline-flex;gap:6px;align-items:center;padding:.4rem .8rem;border-radius:999px;margin:4px;font-weight:700;font-size:.9rem;border:1px solid var(--line)}
.pill.good{border-color:rgba(52,211,153,.45);background:rgba(52,211,153,.08)}
.pill.warn{border-color:rgba(251,191,36,.45);background:rgba(251,191,36,.08)}

/* tables */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th,.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{color:var(--cyan);font-size:.8rem;font-weight:800;letter-spacing:.03em;white-space:nowrap}
.tbl tr.me td{background:rgba(34,211,238,.08)}
.rank-medal{font-size:1.4rem}

/* reflection */
.refl-q{display:flex;gap:10px;align-items:flex-start;font-weight:700;font-size:1.02rem}
.refl-n{flex:0 0 30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(167,139,250,.18);color:#ddd6fe;font-family:var(--font-display);font-size:.85rem}
.conf-row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.conf{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:14px;border:1.5px solid var(--line-2);background:rgba(14,26,56,.85);color:var(--text);cursor:pointer;font:inherit;font-weight:800}
.conf .ce{font-size:1.9rem}
.conf small{font-size:.66rem;color:var(--muted);font-weight:600;text-align:center}
.conf.sel{border-color:var(--violet);background:rgba(167,139,250,.16);box-shadow:0 0 16px rgba(167,139,250,.4)}

/* warm-up */
.tdc{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:860px){.tdc{grid-template-columns:repeat(3,1fr)}}
.tdc-card{border-radius:18px;padding:20px;border:1.5px solid}
.tdc-card h3{font-family:var(--font-display);font-weight:900;font-size:1.35rem;margin:6px 0 8px;letter-spacing:.06em}
.tdc-card p{margin:0;font-size:1.05rem;line-height:1.6}
.tdc-think{border-color:rgba(34,211,238,.5);background:rgba(34,211,238,.06)}
.tdc-disc{border-color:rgba(167,139,250,.5);background:rgba(167,139,250,.06)}
.tdc-conn{border-color:rgba(52,211,153,.5);background:rgba(52,211,153,.06)}
.disc-timer{font-family:var(--font-display);font-size:2.4rem;font-weight:900;text-align:center;color:var(--violet)}

/* team battle */
.tb-scores{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tb-score{border-radius:16px;padding:12px;text-align:center;border:1.5px solid var(--tc);background:color-mix(in srgb,var(--tc) 10%,transparent)}
.tb-name{font-weight:800;color:var(--tc)}
.tb-pts{font-family:var(--font-display);font-weight:900;font-size:2rem}
.tb-answers{display:grid;gap:10px}
.tb-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 12px;border-radius:14px;border:1px solid var(--line);border-left:5px solid var(--tc)}
.tb-rname{font-weight:800;min-width:110px}
.tb-pick{width:52px;height:48px;border-radius:12px;border:1.5px solid var(--line-2);background:rgba(14,26,56,.85);color:var(--text);font-family:var(--font-display);font-weight:800;font-size:1.05rem;cursor:pointer}
.tb-pick.on{background:var(--tc);color:#050915;border-color:var(--tc)}
.tb-pick.right{box-shadow:0 0 0 3px var(--green)}
.tb-pick.bad{box-shadow:0 0 0 3px var(--rose)}
.tb-res{margin-left:auto;font-weight:800}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:12px;margin-top:20px;flex-wrap:wrap}
.pod{text-align:center;border-radius:16px 16px 0 0;padding:14px 10px;min-width:130px;border:1.5px solid var(--tc);background:color-mix(in srgb,var(--tc) 12%,transparent)}

/* tabs */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.tab{padding:.6rem 1rem;border-radius:12px;border:1px solid var(--line);background:rgba(14,26,56,.7);color:var(--text);font:inherit;font-weight:700;cursor:pointer}
.tab.active{border-color:var(--cyan);background:rgba(34,211,238,.12);color:#a5f3fc}
.chart-box{position:relative;height:290px}
.bar-in{height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;min-width:80px}
.bar-in span{display:block;height:100%;background:var(--rose)}
.blocks{font-family:var(--font-mono);font-size:1.3rem;color:var(--green);letter-spacing:.05em}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:700}
.switch input{width:22px;height:22px;accent-color:var(--cyan)}

/* modal, toast, overlays */
.modal-back{position:fixed;inset:0;background:rgba(2,6,23,.78);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:100;display:grid;place-items:center;padding:16px}
.modal{max-width:580px;width:100%;max-height:88vh;overflow:auto;animation:pop .28s ease}
.modal-title{font-family:var(--font-display);font-weight:800;font-size:1.25rem;margin:0 0 8px}
#toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:120;display:flex;flex-direction:column;gap:10px;max-width:min(360px,calc(100vw - 32px))}
.toast{padding:12px 16px;border-radius:14px;background:var(--panel-solid);border:1px solid var(--line-2);box-shadow:0 10px 30px rgba(0,0,0,.45);animation:slideIn .3s ease;font-weight:600}
.toast.ok{border-color:rgba(52,211,153,.6)}
.toast.badge{border-color:rgba(251,191,36,.7);box-shadow:0 0 24px rgba(251,191,36,.25)}
.overlay{position:fixed;inset:0;z-index:95;background:rgba(3,7,20,.95);display:grid;place-items:center;text-align:center;padding:20px}
.count-num{font-family:var(--font-display);font-weight:900;font-size:clamp(5rem,22vw,11rem);color:var(--cyan);text-shadow:0 0 40px rgba(34,211,238,.6);animation:pop .5s ease}
.levelup-emo{font-size:4rem;animation:floaty 2s ease-in-out infinite}
.confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:130;pointer-events:none;border-radius:2px;animation:fall linear forwards}

/* animations */
@keyframes pop{0%{transform:scale(.88);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes blink{50%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes slideIn{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.shake{animation:shake .42s}

/* ---------- Presentation Mode ---------- */
body.present{--fs-q:clamp(1.5rem,2.6vw,2.2rem)}
body.present #app{max-width:1440px}
body.present .opt{font-size:clamp(1.15rem,1.9vw,1.55rem);min-height:84px}
body.present .opt .letter{flex-basis:52px;height:52px;font-size:1.3rem}
body.present .scenario p,body.present .bubble,body.present .threat-banner{font-size:clamp(1.15rem,1.9vw,1.5rem)}
body.present .term-body{font-size:clamp(1rem,1.5vw,1.3rem)}
body.present .feedback{font-size:1.2rem}
body.present .timer{font-size:2rem;min-width:100px}
body.present .qcount{font-size:1.4rem}
body.present #bg-canvas{opacity:.3}
body.present .hide-present{display:none!important}
.present-only{display:none}
body.present .present-only{display:inline-flex}

@media(max-width:640px){
  .card{padding:16px}
  #app{padding:14px 10px 70px}
  .hide-sm{display:none}
  .pinfo .xpbar,.plv{display:none}
  .pname{max-width:84px}
  .brand .bt{display:none}
  .tb-inner{flex-wrap:nowrap;gap:6px;padding:8px 10px}
  .pchip{padding:4px 10px 4px 4px;gap:6px}
  .pav{width:32px;height:32px;font-size:1.25rem}
  .tb-actions{gap:4px}
  .conf small{display:none}
  .tb-rname{min-width:0;width:100%}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

function keyName(n){ return String(n||'').trim().toLowerCase(); }

function saveAllPlayers(p){ lsSet(KEY.players, p); }
function newStudent(name, avatar){
  return {name:String(name).trim(), avatar:avatar||AVATARS[0], xp:0, level:'Cyber Rookie', score:0, gamesCompleted:0,
    games:{}, badges:[], quizResults:[], reflections:[], topicStats:{}, qs:{}, answered:0, correct:0,
    created:Date.now(), lastActive:Date.now()};
}
function normalizeStudent(s){
  const o=Object.assign(newStudent(s.name||'Siswa', s.avatar), s);
  ['games','topicStats','qs'].forEach(k=>{ if(!o[k]||typeof o[k]!=='object') o[k]={}; });
  ['badges','quizResults','reflections'].forEach(k=>{ if(!Array.isArray(o[k])) o[k]=[]; });
  return o;
}
function calcScorePct(s){ return s.answered ? Math.round(s.correct/s.answered*100) : 0; }

/* Memuat data siswa (default: siswa aktif) */
function loadStudent(name){
  const n = (name !== undefined && name !== null) ? name : lsGet(KEY.current, null);
  if(!n) return null;
  const s = loadAllPlayers()[keyName(n)];
  return s ? normalizeStudent(s) : null;
}
/* Menyimpan data siswa + memperbarui level, skor, jumlah game */
function saveStudent(s){
  if(!s) return;
  s.level = calculateLevel(s.xp).name;
  s.score = calcScorePct(s);
  s.gamesCompleted = GAMES.filter(g=>s.games[g.id]).length;
  s.lastActive = Date.now();
  const all = loadAllPlayers(); all[keyName(s.name)] = s; saveAllPlayers(all);
}
/* Menghitung level dari XP */
function calculateLevel(xp){
  xp = xp||0; let i=0;
  LEVELS.forEach((l,k)=>{ if(xp>=l.min) i=k; });
  const L=LEVELS[i], N=LEVELS[i+1];
  const pct = N ? Math.round((xp-L.min)/(N.min-L.min)*100) : 100;
  return Object.assign({}, L, {index:i, next:N?N.min:null, nextName:N?N.name:null, pct});
}
/* Memeriksa badge baru; mengembalikan id badge yang baru didapat */
function calculateBadge(s){
  const g=s.games, got=[];
  const rules = {
    first_defender: GAMES.some(x=>g[x.id]),
    threat_hunter: !!g.threat,
    password_guardian: !!g.password,
    cia_expert: !!(g.cia && g.cia.best>=70),
    cyber_detective: !!g.forensic,
    social_shield: !!g.social,
    escape_artist: !!g.escape,
    quiz_ace: s.quizResults.some(q=>q.mode==='quiz' && q.pct>=80 && q.total>=5),
    cyber_master: GAMES.every(x=>g[x.id])
  };
  Object.entries(rules).forEach(([id,ok])=>{ if(ok && !s.badges.includes(id)){ s.badges.push(id); got.push(id); } });
  return got;
}
/* Menyimpan hasil satu permainan (XP, skor terbaik, badge, level) */
function saveScore(gameId, res){
  if(!S) return {xp:0, newBadges:[], levelUp:null, replay:false};
  const before = calculateLevel(S.xp);
  const prev = S.games[gameId];
  const replay = !!(prev && prev.plays>0);
  const xp = replay ? Math.round(res.xp*0.5) : res.xp;   // main ulang = 50% XP (latihan)
  S.xp += xp;
  S.games[gameId] = {best:Math.max(prev?prev.best:0, res.pct), last:res.pct, plays:(prev?prev.plays:0)+1,
    time:res.time, bestTime: prev&&prev.bestTime ? Math.min(prev.bestTime,res.time) : res.time, date:Date.now()};
  const newBadges = calculateBadge(S);
  saveStudent(S);
  const after = calculateLevel(S.xp);
  return {xp, newBadges, levelUp: after.index>before.index ? after : null, replay};
}
/* Mengambil hasil terbaik sebuah game milik siswa aktif */
function loadScore(gameId){ return S && S.games[gameId] ? S.games[gameId] : null; }
/* Reset progres: 'me' = siswa aktif, 'all' = semua data */
function resetProgress(scope){
  if(scope==='all'){
    [KEY.players, KEY.current, KEY.anon, KEY.teams].forEach(k=>localStorage.removeItem(k));
    S=null;
  } else if(S){
    S = newStudent(S.name, S.avatar); saveStudent(S);
  }
}
/* Mencatat setiap jawaban untuk analisis materi & soal */
function recordAnswer(it, ok){
  if(!it || !it.id) return;
  if(S){
    S.answered++; if(ok) S.correct++;
    const t = it.topic || 'Lainnya';
    const ts = S.topicStats[t] || (S.topicStats[t]={c:0,w:0}); ok ? ts.c++ : ts.w++;
    const q = S.qs[it.id] || (S.qs[it.id]={c:0,w:0}); ok ? q.c++ : q.w++;
    saveStudent(S);
  } else {
    const an = lsGet(KEY.anon, {}); const q = an[it.id] || (an[it.id]={c:0,w:0}); ok ? q.c++ : q.w++; lsSet(KEY.anon, an);
  }
}
function topicList(s){
  return Object.entries(s.topicStats||{}).map(([t,v])=>({t, c:v.c, w:v.w, n:v.c+v.w, acc:Math.round(v.c/Math.max(1,v.c+v.w)*100)})).filter(x=>x.n>0);
}

/* =========================================================
   BAGIAN 4 — AUDIO (Web Audio API, tanpa file, tanpa autoplay)
   ========================================================= */
const Sound = {
  ctx:null,
  tone(freq, start, dur, type, vol){
    const c=this.ctx, t0=c.currentTime+start;
    const o=c.createOscillator(), g=c.createGain();
    o.type=type||'sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol||0.12,t0+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0+dur+0.05);
  },
  play(kind){
    if(!getSettings().sound) return;
    try{
      if(!this.ctx) this.ctx = new (window.AudioContext||window.webkitAudioContext)();
      if(this.ctx.state==='suspended') this.ctx.resume();
      const seq = {
        correct:[[660,0,.12],[990,.1,.2]],
        wrong:[[240,0,.18,'triangle',.14],[170,.14,.28,'triangle',.14]],
        levelup:[[523,0,.14],[659,.12,.14],[784,.24,.14],[1047,.36,.4]],
        badge:[[880,0,.12],[1175,.1,.12],[1568,.2,.35]],
        complete:[[523,0,.15],[659,.15,.15],[784,.3,.15],[1047,.45,.22],[784,.66,.12],[1047,.8,.5]],
        click:[[520,0,.05,'sine',.06]],
        tick:[[1000,0,.05,'square',.03]]
      }[kind] || [];
      seq.forEach(t=>this.tone(t[0],t[1],t[2],t[3],t[4]));
    }catch(e){}
  }
};
function toggleSound(){
  const on=!getSettings().sound; setSettings({sound:on});
  document.querySelectorAll('.snd-ico').forEach(e=>e.textContent=on?'🔊':'🔇');
  toast(on?'🔊 Suara aktif':'🔇 Suara dimatikan');
  if(on) Sound.play('click');
}

function toast(html, kind, ms){
  const t=document.createElement('div'); t.className='toast '+(kind||''); t.innerHTML=html;
  $('#toasts').appendChild(t); setTimeout(()=>t.remove(), ms||3200);
}
function modal(html, opts){
  closeModal();
  const d=document.createElement('div'); d.className='modal-back'; d.id='modal-back';
  d.innerHTML=`<div class="card glow modal" role="dialog" aria-modal="true">${html}</div>`;
  if(!(opts&&opts.sticky)) d.addEventListener('click',e=>{ if(e.target===d) closeModal(); });
  document.body.appendChild(d); return d;
}
function closeModal(){ const m=$('#modal-back'); if(m) m.remove(); }
function confetti(n){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const colors=['#22d3ee','#a78bfa','#34d399','#fbbf24','#60a5fa','#fb7185'];
  for(let i=0;i<(n||60);i++){
    const c=document.createElement('div'); c.className='confetti';
    c.style.left=Math.random()*100+'vw'; c.style.background=colors[i%colors.length];
    c.style.animationDuration=(2+Math.random()*2)+'s'; c.style.animationDelay=(Math.random()*.6)+'s';
    document.body.appendChild(c); setTimeout(()=>c.remove(), 4800);
  }
}
let typeTid=null;
function typeText(sel, text){
  clearTimeout(typeTid); const el=$(sel); if(!el) return; let i=0;
  const step=()=>{ if(!document.body.contains(el)) return; el.textContent=text.slice(0,++i); if(i<text.length) typeTid=setTimeout(step, 45); };
  step();
}
function celebrate(saved){
  let delay=700;
  if(saved.levelUp){
    const L=saved.levelUp;
    setTimeout(()=>{ Sound.play('levelup'); confetti(80);
      if(currentScreen==='runner' && Runner.st && !Runner.st.finished){ toast(`<div style="display:flex;gap:10px;align-items:center"><span style="font-size:2rem">${L.icon}</span><div><b>LEVEL UP!</b><br>${L.name}</div></div>`,'badge',4500); return; }
      modal(`<div class="center"><div class="levelup-emo">${L.icon}</div><h2 class="big-result">LEVEL UP!</h2>
      <p style="font-size:1.15rem">Kamu naik ke level <b>${L.name}</b>.</p>
      <p class="muted">${L.nextName?`Kumpulkan ${fmtNum(L.next)} XP untuk menjadi ${L.nextName}.`:'Kamu sudah mencapai level tertinggi. Luar biasa!'}</p>
      <button class="btn btn-primary mt" onclick="closeModal()">Lanjutkan misi</button></div>`);
    }, delay);
    delay += 900;
  }
  (saved.newBadges||[]).forEach((id,k)=>setTimeout(()=>{ const b=badgeById(id); Sound.play('badge');
    toast(`<div style="display:flex;gap:10px;align-items:center"><span style="font-size:2rem">${b.icon}</span><div><b>Badge baru terbuka!</b><br>${b.name}</div></div>`,'badge',4200);

function recommendations(s){
  const recs=[];
  topicList(s).filter(t=>t.n>=2 && t.acc<70).sort((a,b)=>a.acc-b.acc).forEach(t=>{
    const g=TOPIC_GAME[t.t]; if(g && !recs.find(r=>r.id===g)) recs.push({id:g, why:`Akurasi ${CAT_LABEL[t.t]||t.t} masih ${t.acc}%`});
  });
  GAMES.forEach(g=>{ if(!s.games[g.id] && !recs.find(r=>r.id===g.id)) recs.push({id:g.id, why:'Belum dimainkan'}); });
  return recs.slice(0,4);
}
function reportBox(s){
  const L=calculateLevel(s.xp), W=30;
  const line=(k,v)=>'║ '+(k.padEnd(7)+' : '+v).slice(0,W-2).padEnd(W-2)+' ║';
  const title='MISSION REPORT', lp=Math.floor((W-title.length)/2);
  return ['╔'+'═'.repeat(W)+'╗', '║'+' '.repeat(lp)+title+' '.repeat(W-lp-title.length)+'║', '╠'+'═'.repeat(W)+'╣',
    line('Student', s.name), line('XP', fmtNum(s.xp)), line('Level', L.name), line('Score', s.score+'%'),
    line('Games', s.gamesCompleted+'/'+GAMES.length), line('Badge', String(s.badges.length)), '╚'+'═'.repeat(W)+'╝'].join('\n');
}

  return `<div class="chat"><div class="chat-head"><span class="chat-av">${s.icon}</span><div><div class="chat-from">${esc(s.from)}</div><div class="chat-sub">${esc(s.ch)} · ${esc(s.sub)}</div></div></div>${s.msgs.map(m=>`<div class="bubble">${esc(m)}</div>`).join('')}<div style="height:6px"></div></div>`;

function netDiagram(){
  return `<div class="net-diagram">${NET_NODES.map((n,i)=>`${i?'<div class="link-arrow">▼</div>':''}<div class="node" id="nn-${i}"><span class="nic">${n.ic}</span><span>${n.n}</span><span class="nstat"></span></div>`).join('')}</div>`;
}
function rangeIdx(a,b){ const r=[]; if(a<=b) for(let i=a;i<=b;i++) r.push(i); else for(let i=a;i>=b;i--) r.push(i); return r; }
function animateDefend(d, ok){
  const path = rangeIdx(d.from, ok ? d.at : d.to), step=260;
  path.forEach((n,k)=>setTimeout(()=>{ const el=$('#nn-'+n); if(el) el.classList.add('hot'); }, k*step));
  setTimeout(()=>{
    if(ok){
      path.forEach(n=>{ const el=$('#nn-'+n); if(el) el.classList.remove('hot'); });
      const at=$('#nn-'+d.at); if(at){ at.classList.add('safe'); at.querySelector('.nstat').textContent='🛡️ BLOCKED'; }
      const b=$('#threat-banner'); if(b){ b.classList.add('done'); b.innerHTML='✅ <span><b>Ancaman berhasil dihentikan!</b> Jaringan aman.</span>'; }
    } else {
      const t=$('#nn-'+d.to); if(t){ t.classList.add('hit'); t.querySelector('.nstat').textContent='⚠️ TERSERANG'; }
    }
  }, path.length*step+120);
}
function threatToItem(t){ return {id:t.id, type:'mcq', topic:'Jenis Serangan', visual:scenarioBox(t.s,'🎯 Skenario'), q:'Jenis serangan apa yang sedang terjadi?', opts:[t.a,...t.o], a:t.a, exp:t.exp, tip:t.tip, recap:t.s, layout:'two'}; }
function defendToItem(d){ return {id:d.id, type:'mcq', topic:d.topic, top:`<div class="threat-banner" id="threat-banner">${d.icon} <span><b>ANCAMAN:</b> ${esc(d.threat)}</span></div>`, visual:netDiagram(), q:'Pertahanan apa yang paling tepat untuk menghentikan ancaman ini?', opts:[d.a,...d.o], a:d.a, exp:d.exp, tip:d.tip, recap:d.threat, layout:'split', after:ok=>animateDefend(d,ok)}; }
function ciaToItem(c){ return {id:c.id, type:'mcq', topic:'CIA Triad', visual:scenarioBox(c.s,'📂 Kasus'), q:'Aspek CIA Triad mana yang paling berkaitan dengan kasus ini?', opts:['C','I','A'].map(k=>CIA_OPTS[k]), a:CIA_OPTS[c.a], fixed:true, layout:'choice3', exp:c.exp, tip:CIA_TIP, recap:c.s}; }
function forensicToItem(f){ return {id:f.id, type:'mcq', topic:f.topic||'Network Forensic', visual:terminalBox(f.title,f.log), q:f.q, opts:[f.a,...f.o], a:f.a, exp:f.exp, tip:f.tip, recap:f.title+' — '+f.q}; }
function socialToItem(s){
  const flags=`<div class="flags"><b>${s.a==='aman'?'✅ Tanda pesan aman:':'🚩 Tanda yang perlu diwaspadai:'}</b><ul>${s.flags.map(f=>`<li>${esc(f)}</li>`).join('')}</ul></div>`;
  return {id:s.id, type:'mcq', topic:'Social Engineering', visual:chatBox(s), q:'Bagaimana penilaianmu terhadap pesan ini?', opts:['aman','curiga','bahaya'].map(k=>SOCIAL_OPTS[k]), a:SOCIAL_OPTS[s.a], fixed:true, layout:'choice3', exp:s.exp+flags, tip:'Periksa: siapa pengirimnya? Adakah link atau file? Apakah meminta password, OTP, uang, atau akses? Adakah desakan waktu?', recap:s.from+' ('+s.ch+'): '+s.msgs.join(' ')};
}
function simpleMcq(x, topic){ return {id:x.id, type:'mcq', topic:x.topic||topic, q:x.q, opts:[x.a,...x.o], a:x.a, exp:x.exp, tip:x.tip, recap:x.q}; }
function rankToItem(p){ return {id:p.id, type:'rank', topic:'Password Security', q:'Urutkan password berikut dari yang PALING LEMAH (1) sampai PALING KUAT (5).', items:p.items,
  exp:'Kekuatan password terutama ditentukan oleh <b>panjang</b>, <b>variasi karakter</b>, dan <b>tidak mudah ditebak</b> (bukan kata umum, nama, tanggal lahir, atau pola keyboard).',
  tip:'Panjang lebih penting daripada rumit. Hindari kata umum, nama, tanggal lahir, dan pola keyboard.', recap:'Urutkan kekuatan: '+p.items.map(x=>x.t).join(', ')}; }

const BUILD = {
  threat:   () => pick(THREATS,10).map(threatToItem),
  defend:   () => pick(DEFENSES,10).map(defendToItem),
  password: () => [...pick(PASSWORD_SETS,3).map(rankToItem), ...pick(PASSWORD_MCQ,3).map(x=>simpleMcq(x,'Password Security'))],
  cia:      () => pick(CIA_CASES,12).map(ciaToItem),
  forensic: () => pick(FORENSICS,6).map(forensicToItem),
  social:   () => pick(SOCIALS,8).map(socialToItem),
  escape:   () => ESCAPE_LEVELS.map((_,i)=>escapeItem(i))
};

/* Escape room: 6 level, masing-masing dari bank soal berbeda */
const ESCAPE_LEVELS = [
  {name:'Temukan jenis serangan', icon:'🎯', pool:()=>THREATS.map(threatToItem)},
  {name:'Identifikasi konsep CIA', icon:'🔺', pool:()=>CIA_CASES.map(ciaToItem)},
  {name:'Konfigurasi firewall', icon:'🧱', pool:()=>ESC_FIREWALL.map(x=>simpleMcq(x,'Firewall'))},
  {name:'Pilih password yang aman', icon:'🔐', pool:()=>ESC_PASSWORD.map(x=>simpleMcq(x,'Password Security'))},
  {name:'Identifikasi phishing', icon:'🎣', pool:()=>SOCIALS.map(socialToItem)},
  {name:'Analisis insiden jaringan', icon:'🔎', pool:()=>FORENSICS.map(forensicToItem)}
];
function escapeItem(level, excludeId){
  const all=ESCAPE_LEVELS[level].pool(); const pool=all.filter(x=>x.id!==excludeId);
  const it=(pool.length?pool:all)[Math.floor(Math.random()*(pool.length||all.length))];
  if(it.layout==='split') it.layout='';  // tampilan ringkas di escape room
  return it;
}
function escapeHeader(st){
  const lv=ESCAPE_LEVELS[st.idx];
  return `<div class="lockrow">${ESCAPE_LEVELS.map((l,i)=>`<div class="lock ${i<st.idx?'open':i===st.idx?'cur':''}" title="Level ${i+1}: ${l.name}">${i<st.idx?'🔓':i===st.idx?l.icon:'🔒'}</div>`).join('')}</div>
  <div class="esc-level">LEVEL ${st.idx+1} · ${lv.name} · ⏱️ <span id="esc-time">${fmtTime(Runner.elapsed())}</span></div>`;
}

function startGame(id){
  if(!S) return needLogin('gameIntro:'+id);
  const g=gameById(id); const nid=nextGameId(id);
  const cfg={id, title:g.title, emoji:g.emoji, mode:id==='escape'?'escape':'game', items:BUILD[id](), timer:0, back:'games', hint:g.hint, summary:g.summary,
    replay:()=>startGame(id), nextLabel:nid?'➡️ Game berikutnya':'🧠 Lanjut ke Cyber Quiz', nextFn:()=>nid?go('gameIntro',nid):go('quiz')};
  if(id==='escape'){ cfg.retry=(idx,old)=>escapeItem(idx, old.id); cfg.headerExtra=escapeHeader; }
  Runner.start(cfg);
}
function nextGameId(id){ const i=GAMES.findIndex(g=>g.id===id); return (i>=0 && i<GAMES.length-1) ? GAMES[i+1].id : null; }

/* =========================================================
   BAGIAN 14 — GAME ENGINE (RUNNER)
   Menangani: pilihan ganda, ranking, menjodohkan, timer,
   pause, petunjuk, feedback edukatif, skor, dan hasil akhir.
   ========================================================= */
const Runner = {
  st:null, tid:null, clockTid:null,
  start(cfg){
    clearActivities();
    currentScreen='runner';
    this.st={cfg, items:cfg.items.slice(), idx:0, correctCount:0, firstTry:0, xp:0, log:[], t0:Date.now(), pausedMs:0, pauseStart:0,
      paused:false, answered:false, timeLeft:0, attempts:0, rankPick:[], matchSel:{}, finished:false};
    this.showItem();
    window.scrollTo(0,0); renderTopbar();
  },
  stop(){ if(this.tid){ clearInterval(this.tid); this.tid=null; } if(this.clockTid){ clearInterval(this.clockTid); this.clockTid=null; } },
  get item(){ return this.st ? this.st.items[this.st.idx] : null; },
  elapsed(){ const st=this.st; if(!st) return 0; const p=st.pausedMs+(st.paused?Date.now()-st.pauseStart:0); return Math.round((Date.now()-st.t0-p)/1000); },
  itemTime(it){ const t=this.st.cfg.timer||0; return t ? (it.type==='match'||it.type==='rank' ? t*2 : t) : 0; },
  showItem(){
    const st=this.st, it=this.item;
    st.answered=false; st.rankPick=[]; st.matchSel={};
    const sh=getSettings().shuffle;
    if(it.type==='mcq' && !it._opts) it._opts = (it.fixed||!sh) ? it.opts.slice() : shuffle(it.opts);
    if(it.type==='match' && !it._rights) it._rights = shuffle(it.pairs.map(p=>p[1]));
    if(it.type==='rank' && !it._order){ let o, n=0; do{ o=shuffle(it.items.map((_,i)=>i)); n++; } while(n<6 && o.every((v,i)=>v===i)); it._order=o; }
    app.innerHTML=this.frame();
    this.startTimer();
    window.scrollTo(0,0);
  },
  frame(){
    const st=this.st, cfg=st.cfg, it=this.item, n=st.items.length, i=st.idx;
    const battle=cfg.mode==='battle', t=this.itemTime(it);
    return `<div class="runner ${battle?'battle':''}">
      <div class="gamebar">
        <div class="row gap-1">
          <button class="btn btn-sm" onclick="Runner.back()"><i class="fa-solid fa-arrow-left"></i> Kembali</button>
          <button class="btn btn-sm btn-icon" onclick="toggleSound()" title="Suara" aria-label="Suara"><span class="snd-ico">${getSettings().sound?'🔊':'🔇'}</span></button>
          <button class="btn btn-sm" onclick="Runner.hint()" title="Petunjuk">❓<span class="hide-sm"> Petunjuk</span></button>
          <button class="btn btn-sm" onclick="Runner.pause()" title="Pause">⏸️<span class="hide-sm"> Pause</span></button>
          <button class="btn btn-sm btn-icon" onclick="Runner.home()" title="Home" aria-label="Home">🏠</button>
        </div>
        <div class="row gap-1">
          ${cfg.showXP!==false?`<span class="chip a">⭐ <b id="rxp">${st.xp}</b> XP</span>`:''}
          <span class="chip g">✅ <b id="rcorrect">${st.correctCount}</b></span>
          ${t?`<div class="timer" id="rtimer" aria-label="Sisa waktu">${t}</div>`:''}
        </div>
      </div>
      <div class="row between" style="margin-bottom:8px"><div class="runner-title">${cfg.emoji} ${esc(cfg.title)}</div><div class="qcount">${battle?'QUESTION':'SOAL'} ${pad2(i+1)}/${pad2(n)}</div></div>
      <div class="xpbar mb"><span style="width:${Math.round(i/n*100)}%"></span></div>
      ${cfg.headerExtra?cfg.headerExtra(st):''}
      <div class="card" id="rstage">${this.body(it)}</div>
      <div id="rfb"></div>
    </div>`;
  },
  body(it){
    const chips = (it.chips||[]).length ? `<div class="chips">${it.chips.map(c=>`<span class="chip ${c[1]||'c'}">${c[0]}</span>`).join('')}</div>` : '';
    let q='';
    if(it.type==='mcq'){
      const cls = it.layout==='choice3' ? 'choice3' : (it.layout==='two' || it._opts.every(o=>o.length<34)) ? 'two' : '';
      q = `<p class="qtext">${esc(it.q)}</p><div class="opts ${cls}">${it._opts.map((o,k)=>`<button class="opt" onclick="Runner.answer(${k})">${it.layout==='choice3'?'':`<span class="letter">${'ABCD'[k]}</span>`}<span>${esc(o)}</span></button>`).join('')}</div>`;
    } else if(it.type==='rank'){
      q = `<p class="qtext">${esc(it.q)}</p><p class="muted small" style="margin:-8px 0 12px">Ketuk sesuai urutan. Ketuk lagi angka terakhir untuk membatalkan. <i>Simulasi edukatif: tidak ada password nyata yang dibobol.</i></p>
        <div class="rank-list">${it._order.map(oi=>`<button class="rank-item" id="rk-${oi}" onclick="Runner.rankTap(${oi})"><span class="rank-num" id="rn-${oi}">?</span><span class="pw">${esc(it.items[oi].t)}</span><span class="rank-res" id="rr-${oi}"></span></button>`).join('')}</div>
        <div class="row mt"><button class="btn btn-sm" onclick="Runner.rankReset()">↺ Ulangi urutan</button><button class="btn btn-primary" id="rk-lock" onclick="Runner.rankCheck()" disabled>🔒 Kunci jawaban</button></div>`;
    } else if(it.type==='match'){
      q = `<p class="qtext">${esc(it.q)}</p><div class="match-list">${it.pairs.map((p,k)=>`<div class="match-row" id="mr-${k}"><div class="match-left">${esc(p[0])}</div><div class="match-arrow">→</div>
        <select class="inp" id="ms-${k}" onchange="Runner.matchPick(${k},this.value)" aria-label="Pasangan untuk ${esc(p[0])}"><option value="">— pilih pasangan —</option>${it._rights.map(r=>`<option value="${esc(r)}">${esc(r)}</option>`).join('')}</select>
        <div class="match-fix" id="mf-${k}"></div></div>`).join('')}</div>
        <div class="row mt"><button class="btn btn-primary" id="mt-check" onclick="Runner.matchCheck()" disabled>✔ Periksa jawaban</button></div>`;
    }
    if(it.layout==='split') return chips+(it.top||'')+`<div class="split"><div>${it.visual||''}</div><div>${q}</div></div>`;
    return chips+(it.top||'')+(it.visual||'')+q;
  },
  startTimer(){
    const st=this.st, cfg=st.cfg; this.stop();
    if(cfg.mode==='escape') this.clockTid=setInterval(()=>{ const e=$('#esc-time'); if(e) e.textContent=fmtTime(this.elapsed()); }, 1000);
    const t=this.itemTime(this.item); if(!t) return;
    st.timeLeft=t; this.paintTimer();
    this.tid=setInterval(()=>{
      if(st.paused||st.answered) return;
      st.timeLeft--; this.paintTimer();
      if(st.timeLeft<=5 && st.timeLeft>0) Sound.play('tick');
      if(st.timeLeft<=0){ clearInterval(this.tid); this.tid=null; this.timeout(); }
    }, 1000);
  },
  paintTimer(){ const el=$('#rtimer'); if(!el) return; const s=this.st.timeLeft; el.textContent='⏱️ '+s; el.classList.toggle('warn', s<=10&&s>5); el.classList.toggle('danger', s<=5); },
  timeout(){ const it=this.item; if(this.st.answered) return; if(it.type==='mcq') this.answer(-1); else if(it.type==='rank') this.rankCheck(true); else this.matchCheck(true); },
  xpFor(){ const st=this.st; if(st.cfg.mode==='escape') return st.attempts===0?100:50; return st.cfg.xpCorrect||100; },

  /* ----- Pilihan ganda ----- */
  answer(k){
    const st=this.st; if(!st||st.answered||st.paused) return;
    const it=this.item, chosen = k===-1 ? null : it._opts[k], ok = chosen===it.a;
    st.answered=true; if(this.tid){ clearInterval(this.tid); this.tid=null; }
    document.querySelectorAll('#rstage .opt').forEach((b,j)=>{ b.disabled=true; const o=it._opts[j];
      if(o===it.a) b.classList.add('correct'); else if(j===k) b.classList.add('wrong'); else b.classList.add('dim'); });
    this.resolve(ok, ok?this.xpFor():0, {chosen, timeout:k===-1});
  },
  /* ----- Ranking password ----- */
  rankTap(oi){
    const st=this.st; if(st.answered||st.paused) return;
    const pos=st.rankPick.indexOf(oi);
    if(pos>=0){ if(pos===st.rankPick.length-1) st.rankPick.pop(); else return; } else st.rankPick.push(oi);
    Sound.play('click'); this.rankPaint();
  },
  rankPaint(){
    const it=this.item, st=this.st;
    it.items.forEach((_,oi)=>{ const pos=st.rankPick.indexOf(oi); $('#rn-'+oi).textContent = pos>=0 ? pos+1 : '?'; $('#rk-'+oi).classList.toggle('picked', pos>=0); });
    const lock=$('#rk-lock'); if(lock) lock.disabled = st.rankPick.length!==it.items.length;
  },
  rankReset(){ if(this.st.answered) return; this.st.rankPick=[]; this.rankPaint(); },
  rankCheck(isTimeout){
    const st=this.st, it=this.item; if(st.answered) return;
    st.answered=true; if(this.tid){ clearInterval(this.tid); this.tid=null; }
    let good=0;
    it.items.forEach((x,oi)=>{ const pos=st.rankPick.indexOf(oi), ok=pos===oi; if(ok) good++;
      const el=$('#rk-'+oi); el.disabled=true; el.classList.remove('picked'); el.classList.add(ok?'correct':'wrong');
      $('#rn-'+oi).textContent = pos>=0 ? pos+1 : '–';
      $('#rr-'+oi).innerHTML=`${ok?'✓':'✗ seharusnya #'+(oi+1)} ${strengthChip(x)}`; });
    const n=it.items.length;
    const table=`<div class="stack mt">${it.items.map((x,i)=>`<div class="pw-exp"><div class="row"><span class="rank-num" style="background:rgba(255,255,255,.08);color:var(--text)">${i+1}</span><span class="pw">${esc(x.t)}</span>${strengthChip(x)}<span class="chip">⏱️ ${x.time}*</span></div><p class="small" style="margin:.4rem 0 0">${x.why}</p></div>`).join('')}</div>
      <p class="muted small">*Perkiraan ilustratif untuk pembelajaran, bukan hasil cracking nyata. Posisi tepat: <b>${good}/${n}</b>.</p>`;
    document.querySelectorAll('#rstage .row.mt').forEach(r=>r.remove());
    this.resolve(good===n, good*20, {extraHtml:table, timeout:isTimeout===true, partial:good});
  },
  /* ----- Menjodohkan ----- */
  matchPick(k,v){ this.st.matchSel[k]=v; const done=this.item.pairs.every((_,j)=>this.st.matchSel[j]); $('#mt-check').disabled=!done; },
  matchCheck(isTimeout){
    const st=this.st, it=this.item; if(st.answered) return;
    st.answered=true; if(this.tid){ clearInterval(this.tid); this.tid=null; }
    let good=0;
    it.pairs.forEach((p,k)=>{ const ok=st.matchSel[k]===p[1]; if(ok) good++;
      $('#mr-'+k).classList.add(ok?'ok':'bad'); $('#ms-'+k).disabled=true;
      $('#mf-'+k).innerHTML = ok ? '✅ Tepat' : `❌ Pasangan yang tepat: <b>${esc(p[1])}</b>`; });
    const n=it.pairs.length;
    this.resolve(good===n, Math.round(100*good/n), {timeout:isTimeout===true, partial:good, partialOf:n});
    const b=$('#mt-check'); if(b) b.remove();
  },
  /* ----- Evaluasi & feedback edukatif ----- */
  resolve(ok, gained, info){
    const st=this.st, it=this.item, cfg=st.cfg;
    st.xp += gained;
    if(ok){ st.correctCount++; if(cfg.mode==='escape' && st.attempts===0) st.firstTry++; }
    st.log.push({it, ok, chosen:info.chosen, gained});
    if(cfg.record!==false) recordAnswer(it, ok);
    Sound.play(ok?'correct':'wrong');
    if(it.after){ try{ it.after(ok); }catch(e){} }
    if(!ok){ const sg=$('#rstage'); if(sg){ sg.classList.remove('shake'); void sg.offsetWidth; sg.classList.add('shake'); } }
    const rx=$('#rxp'); if(rx) rx.textContent=st.xp;
    const rc=$('#rcorrect'); if(rc) rc.textContent=st.correctCount;
    this.feedback(ok, gained, info);
  },
  feedback(ok, gained, info){
    const st=this.st, it=this.item, cfg=st.cfg;
    const last = st.idx===st.items.length-1;
    const part = !ok && gained>0;
    const kind = ok ? 'ok' : part ? 'part' : 'no';
    let head;
    if(ok) head=`✓ ${cfg.mode==='battle'?'BENAR!':'Benar!'} ${gained&&cfg.showXP!==false?`<span class="xp-pop">+${gained} XP</span>`:''}`;
    else if(info.timeout) head='⏱️ Waktu habis!';
    else if(part) head=`🟡 Hampir tepat! ${cfg.showXP!==false?`<span class="xp-pop">+${gained} XP</span>`:''}`;
    else head='❌ Kurang tepat.';
    const ans = (!ok && it.type==='mcq') ? `<p>Jawaban yang tepat: <b>${esc(it.a)}</b>${info.chosen?` · jawabanmu: ${esc(info.chosen)}`:''}</p>` : '';
    const tip = (!ok && it.tip) ? `<div class="tip">💡 Coba ingat kembali: ${esc(it.tip)}</div>` : '';
    let btns;
    if(!ok && cfg.retry){
      btns = `<button class="btn btn-primary" onclick="Runner.retry()">🔁 Coba lagi (tantangan baru)</button>` + (st.attempts>=1?`<button class="btn" onclick="Runner.next()">⏭ Lewati level (0 XP)</button>`:'');
    } else if(ok && cfg.mode==='escape'){
      btns = `<button class="btn btn-primary" onclick="Runner.next()">${last?'🎉 Buka pintu terakhir':'🔓 Buka kunci berikutnya'}</button>`;
    } else {
      btns = `<button class="btn btn-primary" onclick="Runner.next()">${last?'🏁 Lihat hasil':'Lanjut ➡️'}</button>`;
    }
    $('#rfb').innerHTML = `<div class="feedback ${kind}" role="status"><div class="fb-head ${kind}">${head}</div>${ans}<div>${it.exp||''}</div>${info.extraHtml||''}${tip}<div class="row mt">${btns}</div></div>`;
    const fb=$('#rfb .feedback'); if(fb && fb.scrollIntoView) setTimeout(()=>fb.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth', block:'nearest'}), 80);
  },
  next(){ const st=this.st; if(!st) return; st.attempts=0; st.idx++; if(st.idx>=st.items.length) this.finish(); else this.showItem(); },
  retry(){ const st=this.st; st.attempts++; st.items[st.idx]=st.cfg.retry(st.idx, this.item); this.showItem(); },
  hint(){
    const it=this.item, cfg=this.st.cfg;
    modal(`<h3 class="modal-title">❓ Petunjuk</h3><p>${esc(it.hint||cfg.hint||'Baca soal dengan teliti, cari kata kuncinya, lalu hubungkan dengan konsep yang sudah kamu pelajari.')}</p>
      <p class="muted small">Pilihan ganda: tekan A–D atau 1–4 pada keyboard. Tekan Enter untuk lanjut.</p><button class="btn btn-primary mt" onclick="closeModal()">Mengerti</button>`);
  },
  pause(){
    const st=this.st; if(!st||st.paused) return;
    st.paused=true; st.pauseStart=Date.now();
    const ov=document.createElement('div'); ov.className='overlay'; ov.id='overlay';
    ov.innerHTML=`<div><div style="font-size:4rem">⏸️</div><h2 class="big-result">PERMAINAN DIJEDA</h2><p class="muted">Soal disembunyikan selama jeda. Timer berhenti.</p>
      <div class="row center mt"><button class="btn btn-primary btn-lg" onclick="Runner.resume()">▶️ Lanjutkan</button><button class="btn btn-lg" onclick="Runner.home()">🏠 Home</button></div></div>`;
    document.body.appendChild(ov);
  },
  resume(){ const st=this.st; if(!st||!st.paused) return; st.pausedMs+=Date.now()-st.pauseStart; st.paused=false; const ov=$('#overlay'); if(ov) ov.remove(); },
  inProgress(){ const st=this.st; return st && !st.finished && (st.idx>0 || st.answered); },
  back(){ if(this.inProgress() && !confirm('Keluar dari permainan? Hasil ronde ini tidak akan disimpan.')) return; go(this.st?this.st.cfg.back||'home':'home'); },
  home(){ if(this.inProgress() && !confirm('Kembali ke Home? Hasil ronde ini tidak akan disimpan.')) return; go('home'); },

  /* ----- Hasil akhir ----- */
  finish(){
    this.stop();
    const st=this.st, cfg=st.cfg; st.finished=true;
    const total=st.items.length;
    const correct = cfg.mode==='escape' ? st.firstTry : st.correctCount;
    const pct = total ? Math.round(correct/total*100) : 0;
    const res={pct, correct, total, xp:st.xp, time:this.elapsed()};
    if(cfg.onFinish){ cfg.onFinish(st,res); return; }

/* Keyboard: A–D / 1–4 untuk menjawab, Enter untuk lanjut (berguna di proyektor) */
document.addEventListener('keydown', e=>{
  const ae=document.activeElement, tag=ae&&ae.tagName;
  if(['INPUT','TEXTAREA','SELECT'].includes(tag)) return;
  if(e.key==='Escape' && $('#modal-back')){ closeModal(); return; }
  if(currentScreen!=='runner' || !Runner.st || Runner.st.finished || Runner.st.paused || $('#modal-back')) return;
  const it=Runner.item;
  if(!Runner.st.answered && it.type==='mcq'){
    const k={a:0,b:1,c:2,d:3,'1':0,'2':1,'3':2,'4':3}[e.key.toLowerCase()];
    if(k!==undefined && k<it._opts.length){ e.preventDefault(); Runner.answer(k); }
  } else if(Runner.st.answered && e.key==='Enter' && tag!=='BUTTON'){
    const b=$('#rfb .btn-primary'); if(b){ e.preventDefault(); b.click(); }
  }
});

function quizItem(q){
  const base={id:q.id, topic:q.cat, exp:q.exp, tip:q.tip, recap:q.q, chips:[[CAT_LABEL[q.cat],'v'],[TYPE_LABEL[q.type],'c']]};
  if(q.type==='match') return Object.assign(base,{type:'match', q:q.q, pairs:q.pairs});
  if(q.type==='tf') return Object.assign(base,{type:'mcq', q:q.q, opts:['Benar','Salah'], a:q.a, fixed:true, layout:'two'});
  const it=Object.assign(base,{type:'mcq', q:q.q, opts:[q.a,...q.o], a:q.a});
  if(q.type==='case'){ it.visual=scenarioBox(q.case,'📂 Studi kasus'); it.recap=q.case+' '+q.q; }
  return it;
}

function countdown(cb){
  const ov=document.createElement('div'); ov.className='overlay'; ov.id='overlay'; document.body.appendChild(ov);
  const seq=['3','2','1','GO!']; let i=0;
  const step=()=>{ if(!document.body.contains(ov)) return; if(i>=seq.length){ ov.remove(); cb(); return; }
    ov.innerHTML=`<div class="count-num">${seq[i]}</div>`; Sound.play(i<3?'tick':'correct'); i++; setTimeout(step, 750); };
  step();
}

function classStats(players){
  const active=players.filter(p=>p.answered>0);
  const avg=active.length?Math.round(active.reduce((a,p)=>a+p.score,0)/active.length):0;
  const agg={};
  players.forEach(p=>Object.entries(p.topicStats||{}).forEach(([t,v])=>{ agg[t]=agg[t]||{c:0,w:0}; agg[t].c+=v.c; agg[t].w+=v.w; }));
  const topics=Object.entries(agg).map(([t,v])=>({t, c:v.c, w:v.w, n:v.c+v.w, acc:Math.round(v.c/Math.max(1,v.c+v.w)*100)})).filter(x=>x.n>0).sort((a,b)=>b.acc-a.acc);
  const pool=topics.filter(x=>x.n>=3).length?topics.filter(x=>x.n>=3):topics;
  const progress=players.length?Math.round(players.reduce((a,p)=>a+(p.gamesCompleted||0),0)/(players.length*GAMES.length)*100):0;
  return {avg, topics, best:pool[0]||null, worst:pool.length?pool[pool.length-1]:null, progress, count:players.length, active:active.length};
}
function questionStats(players){
  const agg={};
  const add=(id,v)=>{ agg[id]=agg[id]||{c:0,w:0}; agg[id].c+=v.c||0; agg[id].w+=v.w||0; };
  players.forEach(p=>Object.entries(p.qs||{}).forEach(([id,v])=>add(id,v)));
  Object.entries(lsGet(KEY.anon,{})).forEach(([id,v])=>add(id,v));
  return Object.entries(agg).map(([id,v])=>{ const m=QINDEX[id]||{q:id,topic:'-',src:'-',a:'-'}; const n=v.c+v.w; return {id, ...m, c:v.c, w:v.w, n, wr:Math.round(v.w/Math.max(1,n)*100)}; })
    .filter(x=>x.n>0).sort((a,b)=>b.wr-a.wr || b.w-a.w);
}
function blocks(p){ const f=Math.round(p/10); return '█'.repeat(f)+'░'.repeat(10-f); }
function mkChart(id, cfg){
  const el=$('#'+id); if(!el) return;
  if(typeof Chart==='undefined'){ el.parentElement.innerHTML='<p class="muted">Grafik memerlukan koneksi internet (Chart.js dimuat dari CDN).</p>'; return; }
  Chart.defaults.color='#cbd5e1'; Chart.defaults.borderColor='rgba(148,163,184,.15)'; Chart.defaults.font.family="'Plus Jakarta Sans', system-ui, sans-serif";
  charts.push(new Chart(el, cfg));
}

  const rows=players.map(p=>{ const lq=p.quizResults.filter(x=>x.mode==='quiz').slice(-1)[0], lr=p.reflections.slice(-1)[0];
    return [p.name,calculateLevel(p.xp).name,p.xp,p.score,p.gamesCompleted,...GAMES.map(g=>p.games[g.id]?p.games[g.id].best:''),p.badges.map(b=>badgeById(b)?badgeById(b).name:b).join(', '),lq?lq.pct:'',p.reflections.length,lr?lr.confidence:'',fmtDate(p.lastActive)]; });
  downloadFile('cyberquest-nilai-'+new Date().toISOString().slice(0,10)+'.csv', '\ufeff'+[head,...rows].map(r=>r.map(q).join(';')).join('\r\n'), 'text/csv;charset=utf-8');
  toast('📄 CSV diunduh','ok');
}
function exportJSON(){
  downloadFile('cyberquest-backup-'+new Date().toISOString().slice(0,10)+'.json', JSON.stringify({type:'cyberquest-backup', version:1, exported:Date.now(), players:loadAllPlayers(), anon:lsGet(KEY.anon,{}), teams:lsGet(KEY.teams,[]), settings:getSettings()}, null, 1));
  toast('💾 Cadangan JSON diunduh','ok');
}
function importFiles(files){
  if(!files || !files.length) return;
  const all=loadAllPlayers(); let n=0, bad=0;
  const merge=p=>{ if(!p||!p.name) return; const k=keyName(p.name); if(!all[k] || (p.lastActive||0)>=(all[k].lastActive||0)){ all[k]=normalizeStudent(p); } n++; };
  Promise.all([...files].map(f=>f.text().then(txt=>{
    try{ const d=JSON.parse(txt);
      if(d.type==='cyberquest-student') merge(d.student);
      else if(d.type==='cyberquest-backup'){ Object.values(d.players||{}).forEach(merge); if(d.anon){ const an=lsGet(KEY.anon,{}); Object.entries(d.anon).forEach(([k,v])=>{ if(!an[k]||(an[k].c+an[k].w)<(v.c+v.w)) an[k]=v; }); lsSet(KEY.anon,an); } }
      else bad++;
    }catch(e){ bad++; }
  }))).then(()=>{ saveAllPlayers(all); toast(`📥 ${n} data siswa diimpor${bad?` · ${bad} file tidak dikenali`:''}.`, bad?'':'ok', 4500); go('teacher','siswa'); });
}
function resetQStats(){
  if(!confirm('Reset statistik jawaban per soal untuk semua siswa? XP dan badge tidak berubah.')) return;
  const all=loadAllPlayers(); Object.values(all).forEach(p=>{ p.qs={}; }); saveAllPlayers(all); localStorage.removeItem(KEY.anon);
  if(S) S=loadStudent(S.name); toast('Statistik soal direset'); go('teacher','data');
}
function resetTeams(){ if(!confirm('Hapus seluruh riwayat Team Battle?')) return; localStorage.removeItem(KEY.teams); toast('Riwayat Team Battle dihapus'); go('teacher','data'); }
function resetAll(){
  const c=prompt('Ini akan menghapus SEMUA data siswa, skor, refleksi, dan riwayat di perangkat ini.\nKetik RESET untuk melanjutkan:');
  if(c!=='RESET') return toast('Reset dibatalkan');
  resetProgress('all'); toast('⚠️ Semua data permainan telah dihapus'); go('teacher','ringkasan');
}

/* =========================================================
   BAGIAN 20 — LATAR BELAKANG NETWORK NODES
   ========================================================= */
function initBg(){
  const c=$('#bg-canvas'); if(!c || !c.getContext) return;
  const ctx=c.getContext('2d'); const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W,H,dpr,pts=[];
  const resize=()=>{ dpr=Math.min(2,window.devicePixelRatio||1); W=c.width=innerWidth*dpr; H=c.height=innerHeight*dpr; c.style.width=innerWidth+'px'; c.style.height=innerHeight+'px';
    const n=Math.min(56,Math.round(innerWidth*innerHeight/30000));
    pts=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.22*dpr,vy:(Math.random()-.5)*.22*dpr,r:(Math.random()*1.5+.8)*dpr})); };
  const draw=()=>{
    ctx.clearRect(0,0,W,H); const d=140*dpr;
    for(let i=0;i<pts.length;i++){ const a=pts[i];
      for(let j=i+1;j<pts.length;j++){ const b=pts[j], dx=a.x-b.x, dy=a.y-b.y, dist=Math.hypot(dx,dy);
        if(dist<d){ ctx.strokeStyle=`rgba(56,189,248,${(1-dist/d)*.28})`; ctx.lineWidth=dpr*.8; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); } }
      ctx.fillStyle='rgba(103,232,249,.7)'; ctx.beginPath(); ctx.arc(a.x,a.y,a.r,0,Math.PI*2); ctx.fill(); }
    if(!reduce && !document.hidden){ pts.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; if(p.x<0||p.x>W) p.vx*=-1; if(p.y<0||p.y>H) p.vy*=-1; }); }
  };
  const loop=()=>{ draw(); if(!reduce) requestAnimationFrame(loop); };
  resize(); addEventListener('resize',()=>{ resize(); if(reduce) draw(); }); loop();
}

/* =========================================================
   BAGIAN 21 — START APLIKASI
   ========================================================= */
buildQIndex();
S = loadStudent();
initBg();
go('home');
